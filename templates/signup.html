<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account · Mitra POS</title><link rel="stylesheet" href="/static/app.css"></head><body class="auth-page"><form method="post" class="panel auth-card">{% csrf_token %}<h1>Create workspace</h1><p>The first account becomes the admin. Ask an admin to create additional accounts.</p>{% if error %}<div class="toast error">{{ error }}</div>{% endif %}<label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><button class="button primary">Create account</button><p>Already registered? <a href="/login/">Sign in</a></p></form></body></html>
